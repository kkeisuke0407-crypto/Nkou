# CORE01 記事LP を GitHub Pages（https://nko.hakobu-family.com/）へ公開する
# main への push で、LPのファイルだけを _site に集めてデプロイする。
# 橋掛けLP（/nkou/fee/ など）は build.mjs が最新のCORE01本文から毎回組み立てる（旧設計・公開中）。
# ポートフォリオLP（/pf/ 以下）は ポートフォリオLP/build.mjs が毎回組み立てる（Stage12・確認用）。
# （IMPLEMENTATION_NOTES.md や調査資料・スクリプトは公開しない）
name: Deploy LP to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site (LP files only)
        run: |
          SRC="案件_N高資料請求/CORE01_記事LP"
          mkdir -p _site
          cp "$SRC/index.html" "$SRC/parts.css" "$SRC/core01.css" "$SRC/main.js" _site/
          cp -r "$SRC/assets" _site/
          echo "nko.hakobu-family.com" > _site/CNAME
          touch _site/.nojekyll
      - name: Build bridge LPs (/nkou/fee/, /nkou/compare/, /nkou/select/)
        run: |
          node "案件_N高資料請求/橋掛けLP/build.mjs" --deploy _site
          find _site -type f | sort
      - name: Build portfolio LPs (/pf/cp01/, /pf/cp02-fee/, /pf/cp04-schooling/)
        run: |
          node "案件_N高資料請求/ポートフォリオLP/build.mjs" --deploy _site
          find _site/pf -type f | sort
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
